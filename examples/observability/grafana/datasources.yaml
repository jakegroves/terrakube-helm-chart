# Provision the three datasources into an existing Grafana via its sidecar
# (label grafana_datasource: "1"). If you enabled the bundled Grafana in
# victoria-metrics-k8s-stack.values.yaml instead, it picks this up automatically.
#
# The URLs below assume the reference stack's release names (see values/*.values.yaml)
# in the `observability` namespace - adjust host/namespace if you renamed a release.
# No `isDefault` is set: a kube-prometheus-stack Grafana already has a default
# Prometheus, and two defaults make the dashboards' ${DS_PROMETHEUS} binding
# nondeterministic. Pick "VictoriaMetrics" from the datasource dropdown, or set it
# default yourself if this is a standalone Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: terrakube-observability-datasources
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmselect-vmcluster-victoria-metrics-k8s-stack.observability.svc:8481/select/0/prometheus
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo-query-frontend.observability.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: victorialogs
            filterByTraceID: true
          serviceMap:
            datasourceUid: victoriametrics
          tracesToMetrics:
            datasourceUid: victoriametrics
            queries:
              - name: 'Request rate'
                query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'
              - name: 'p95 latency'
                query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m])) by (le))'
          nodeGraph:
            enabled: true
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server.observability.svc:9428
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: '${__value.raw}'
