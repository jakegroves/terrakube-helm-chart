apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace pinned: these are plain metric dashboards for any Prometheus-compatible
# backend. Apply them into whatever namespace your Grafana's dashboard sidecar watches,
# e.g. `kubectl apply -k examples/observability/grafana/dashboards-generic/ -n monitoring`
# for a default kube-prometheus-stack install.
configMapGenerator:
  - name: tk-dash-jvm
    files: [jvm.json]
  - name: tk-dash-terrakube-api
    files: [terrakube-api.json]
  - name: tk-dash-terrakube-executor
    files: [terrakube-executor.json]
  - name: tk-dash-terrakube-flow
    files: [terrakube-flow.json]
  - name: tk-dash-terrakube-overview
    files: [terrakube-overview.json]
  - name: tk-dash-terrakube-resources-registry
    files: [terrakube-resources-registry.json]
  - name: tk-dash-terrakube-runs
    files: [terrakube-runs.json]
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Terrakube Infrastructure
