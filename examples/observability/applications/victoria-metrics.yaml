apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-victoria-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: "0.91.2"
      helm:
        valueFiles:
          - $values/examples/observability/values/victoria-metrics-k8s-stack.values.yaml
    - repoURL: https://github.com/terrakube-io/terrakube-helm-chart
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
