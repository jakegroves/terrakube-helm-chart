apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: terrakube-usage
  namespace: observability
  labels:
    role: usage
spec:
  groups:
    # ---- recording rules feeding the run / flow / resource dashboards ----
    - name: terrakube-usage.rules
      interval: 1m
      rules:
        - record: terrakube:run_success_rate:ratio_rate1h
          expr: |
            sum(rate(terrakube_run_finished_total{outcome=~"completed|noChanges"}[1h]))
            / clamp_min(sum(rate(terrakube_run_finished_total[1h])), 0.0001)
        - record: terrakube:run_success_rate:ratio_rate6h
          expr: |
            sum(rate(terrakube_run_finished_total{outcome=~"completed|noChanges"}[6h]))
            / clamp_min(sum(rate(terrakube_run_finished_total[6h])), 0.0001)
        - record: terrakube:runs:rate1d
          expr: sum(increase(terrakube_run_finished_total[1d]))
        - record: terrakube:run_duration_seconds:p95_rate1h
          expr: histogram_quantile(0.95, sum by (le) (rate(terrakube_run_duration_seconds_bucket[1h])))
        - record: terrakube:approval_wait_seconds:p95_rate1h
          expr: histogram_quantile(0.95, sum by (le) (rate(terrakube_run_approval_wait_seconds_bucket[1h])))
        - record: terrakube:run_success_rate:ratio_rate1h:by_org
          expr: |
            sum by (organization) (rate(terrakube_run_finished_total{outcome=~"completed|noChanges"}[1h]))
            / clamp_min(sum by (organization) (rate(terrakube_run_finished_total[1h])), 0.0001)
        - record: terrakube:resource_changes:rate1d
          expr: sum by (phase, action) (increase(terrakube_resource_changes_total[1d]))

    # ---- opt-in alerts: ship inert (`and vector(0)` never fires) ----
    # Remove the `and vector(0)` clause and wire a VMAlert notifier to activate. See SLO.md.
    - name: terrakube-usage.alerts
      interval: 1m
      rules:
        - alert: TerrakubeRunFailureRateHigh
          expr: (terrakube:run_success_rate:ratio_rate1h < 0.8) and vector(0)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Terrakube run success rate below 80% for 30m"
        - alert: TerrakubeApprovalQueueBacklog
          expr: (sum(terrakube_run_awaiting_approval) > 10) and vector(0)
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "More than 10 runs awaiting approval for over an hour"
        - alert: TerrakubeQueueWaitSLOBreach
          expr: (histogram_quantile(0.95, sum by (le) (rate(terrakube_job_queue_wait_seconds_bucket[15m]))) > 300) and vector(0)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "p95 job queue wait above 5m"
