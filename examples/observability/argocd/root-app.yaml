# App-of-apps root. Point `path` at the overlay for the environment you are
# deploying (overlays/dev | overlays/staging | overlays/prod), or parameterise it
# per ArgoCD project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/terrakube-io/terrakube-helm-chart
    targetRevision: main
    path: examples/observability/argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
